<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>รหัสไปรษณีย์ฝาแตก โดยพันรัฐ</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fafff5">
    <!-- Fullscreen / standalone app behavior when added to home screen -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="รหัสไปรษณีย์ฝาแตก">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/a/AVvXsEgMEvGooTXSJnHe1TF-uy0wYy0GdFdYM8iQ8LMqim1CpDnRCSgIBdop9K2C1Xf-Gtesdb8kAZvm6HYT46gBUgw1ulekS-QDvDLGAPuT_l0X6e1hTDhgCqgXrm-MSIdZb9siNio-1hbIF6F_nLPiWCGWZ7pe-wkZysTLs60EzOZSGB1uK0hiSOfW7gZUoN27">

    <style>
        :root{
            --ink:#000000;
            --paper:#fafff5;
            --card:#ffffff;
            --card-alt:#f2f9e4;
            --border:#e7efd9;
            --crimson:#7ba83f;
            --crimson-dark:#2f4a12;
            --gold:#c9f98d;
            --sunday:#5a8228;
            --muted:#4a5142;
            --important:#b14b4b;
            --shadow-soft:0 1px 2px rgba(26,31,22,.06);
            --shadow-lift:0 18px 40px -18px rgba(26,31,22,.35);
            --radius-lg:22px;
            --radius-md:14px;
            --radius-sm:9px;
            --ease:cubic-bezier(.16,1,.3,1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Patrick Hand', sans-serif;
        }

        html {
            height: 100%;
        }

        body {
            background:
                radial-gradient(circle at 15% 8%, rgba(123,168,63,.08), transparent 45%),
                radial-gradient(circle at 90% 92%, rgba(201,249,141,.18), transparent 40%),
                var(--paper);
            color: var(--ink);
            min-height: 100vh;
            min-height: 100dvh;
            padding-top: calc(15px + env(safe-area-inset-top));
            padding-bottom: calc(90px + env(safe-area-inset-bottom));
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Paper capsule, moss-green accents */
        .ios-capsule {
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: 999px;
            box-shadow: var(--shadow-lift);
            transition: all 0.3s var(--ease);
        }

        /* App install banner (FT Web Hub) */
        .app-install-banner {
            width: 92%;
            max-width: 600px;
            margin: 0 auto 10px auto;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px 8px 8px;
            animation: fadeSlideUp 0.4s cubic-bezier(0.16,1,0.3,1);
        }
        .app-install-banner.hidden {
            display: none;
        }
        .app-install-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--card-alt);
        }
        .app-install-text {
            flex: 1;
            min-width: 0;
        }
        .app-install-title {
            font-weight: 700;
            font-size: 14px;
            color: var(--ink);
            line-height: 1.2;
        }
        .app-install-sub {
            font-size: 11.5px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .app-install-btn {
            flex-shrink: 0;
            background: var(--crimson);
            color: #ffffff;
            font-weight: 700;
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 999px;
            white-space: nowrap;
            transition: background 0.15s, transform 0.12s;
        }
        .app-install-btn:hover {
            background: var(--crimson-dark);
        }
        .app-install-btn:active {
            transform: scale(0.95);
        }
        .app-install-close {
            flex-shrink: 0;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
        }
        .app-install-close svg {
            width: 13px;
            height: 13px;
        }
        .app-install-close:hover {
            background: var(--card-alt);
            color: var(--ink);
        }

        /* Top Container Layout */
        .top-group-container {
            width: 92%;
            max-width: 600px;
            margin: 0 auto 15px auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search-box {
            display: flex;
            align-items: center;
            padding: 12px 20px;
        }

        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 16px;
            color: var(--ink);
            outline: none;
            padding-left: 10px;
        }

        .search-box .icon {
            width: 20px;
            height: 20px;
            color: var(--muted);
        }

        /* Integrated District Results Panel */
        .district-results-panel {
            padding: 15px 20px;
            border-radius: var(--radius-md);
            display: none;
            max-height: 220px;
            overflow-y: auto;
        }

        .zone-title {
            font-family: 'Caveat', cursive;
            font-size: 17px;
            font-weight: 700;
            color: var(--crimson-dark);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .zone-title .icon {
            width: 16px;
            height: 16px;
            color: var(--crimson);
        }

        .list-items {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
        }

        /* touch-friendly district buttons */
        .clickable-item {
            background: var(--card-alt);
            border: 1.5px solid var(--border);
            padding: 10px 8px;
            min-height: 46px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.15s var(--ease);
            font-size: 14px;
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            color: var(--ink);
            position: relative;
        }

        .clickable-item:hover {
            background: #e9f4d5;
            border-color: var(--crimson);
        }

        .clickable-item:active {
            transform: scale(0.96);
        }

        .clickable-item.active {
            background: var(--crimson);
            color: #ffffff;
            border-color: var(--crimson);
        }

        .prov-tag {
            display: block;
            font-size: 10.5px;
            font-weight: 400;
            opacity: 0.65;
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        mark {
            background: var(--gold);
            color: var(--crimson-dark);
            border-radius: 3px;
            padding: 0 1px;
        }
        .clickable-item.active mark {
            background: rgba(255,255,255,0.35);
            color: inherit;
        }

        .copy-btn.active-fav-btn {
            background: #c9932f;
            color: #ffffff;
            border-color: #c9932f;
        }

        /* Main Map Layout */
        .container {
            width: 92%;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius-lg);
            padding: 18px;
            border: 1.5px solid var(--border);
            box-shadow: var(--shadow-lift);
            margin-bottom: 15px;
        }

        .card-title {
            font-family: 'Caveat', cursive;
            font-size: 19px;
            font-weight: 700;
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 15px;
        }
        .card-title-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title .icon {
            width: 18px;
            height: 18px;
            color: var(--crimson);
        }

        .theme-toggle {
            background: var(--card-alt);
            border: 1.5px solid var(--border);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: var(--crimson);
        }
        .theme-toggle:active {
            transform: scale(0.9);
        }
        .theme-toggle .icon {
            width: 16px;
            height: 16px;
        }

        .grid-map {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .map-row {
            display: flex;
            gap: 8px;
            width: 100%;
            justify-content: center;
        }

        .map-block {
            background: var(--card-alt);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 4px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s var(--ease);
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-width: 0;
        }

        .map-block:hover {
            border-color: var(--crimson);
        }

        .map-block:active {
            transform: scale(0.96);
        }

        .map-block.active {
            background: var(--crimson);
            color: #ffffff;
            border-color: var(--crimson);
            box-shadow: 0 4px 12px rgba(123, 168, 63, 0.35);
        }

        .map-block .code-num {
            font-family: 'Caveat', cursive;
            font-size: clamp(14px, 4.2vw, 20px);
            font-weight: 700;
            margin-bottom: 2px;
        }

        .map-block .name-lbl {
            font-size: clamp(8.5px, 2.6vw, 12px);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            line-height: 1.2;
        }

        .map-block.core-center {
            border: 2px dashed var(--crimson);
            background: #eef7dc;
        }

        /* Fixed Bottom Zipcode Panel */
        .bottom-floating-panel {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            padding: 15px 20px;
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            border-top-left-radius: var(--radius-lg);
            border-top-right-radius: var(--radius-lg);
            z-index: 2000;
            display: none;
            box-shadow: 0 -18px 40px -18px rgba(26,31,22,.35);
        }

        .zip-display-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            width: 100%;
        }

        .zip-info-text {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 0;
        }

        .zip-info-text .area-name {
            font-family: 'Caveat', cursive;
            font-size: 19px;
            font-weight: 700;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .zip-info-text .zip-number {
            font-family: monospace;
            font-size: 19px;
            font-weight: 700;
            color: var(--crimson-dark);
            background: var(--card-alt);
            border: 1px solid var(--border);
            padding: 2px 12px;
            border-radius: 20px;
        }

        .action-btns {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .copy-btn {
            background: var(--crimson);
            color: #ffffff;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(123, 168, 63, 0.3);
            flex-shrink: 0;
        }
        .copy-btn .icon {
            width: 18px;
            height: 18px;
        }

        .copy-btn:hover {
            background: var(--crimson-dark);
        }
        .copy-btn:active {
            transform: scale(0.92);
        }

        .copy-btn.share-btn {
            background: var(--card-alt);
            color: var(--crimson-dark);
            box-shadow: none;
            border: 1.5px solid var(--border);
        }

        /* Toast UI */
        .toast {
            position: fixed;
            bottom: calc(30px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--crimson-dark);
            color: #fafff5;
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: var(--shadow-lift);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2500;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            pointer-events: none;
        }
        .toast .icon {
            width: 16px;
            height: 16px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 10px;
            color: var(--muted);
            grid-column: 1 / -1;
        }
        .empty-state .icon {
            width: 28px;
            height: 28px;
            color: var(--border);
        }
        .empty-state p {
            font-size: 13.5px;
        }

        /* ===== Animations ===== */
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(12px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes panelSlideDown {
            from { opacity: 0; transform: translateY(-10px); max-height: 0; }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes panelSlideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(30px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.85); }
            to   { opacity: 1; transform: scale(1); }
        }
        @keyframes pulseRing {
            0%   { box-shadow: 0 0 0 0 rgba(123,168,63,0.35); }
            100% { box-shadow: 0 0 0 10px rgba(123,168,63,0); }
        }

        .map-block {
            opacity: 0;
            animation: fadeSlideUp 0.45s var(--ease) forwards;
        }

        .map-block.active {
            animation: fadeSlideUp 0.45s var(--ease) forwards, pulseRing 0.6s ease-out;
        }

        .district-results-panel.panel-open {
            animation: panelSlideDown 0.3s var(--ease);
        }

        .clickable-item {
            opacity: 0;
            animation: popIn 0.3s var(--ease) forwards;
        }

        .bottom-floating-panel.panel-open {
            animation: panelSlideUp 0.35s var(--ease);
        }

        .zip-info-text .zip-number {
            animation: popIn 0.3s var(--ease);
        }

        /* Smaller screens: shrink map text further so nothing gets cut off */
        @media (max-width: 380px) {
            .map-block {
                padding: 8px 2px;
                border-radius: 8px;
            }
            .map-block .code-num {
                font-size: clamp(13px, 4vw, 17px);
            }
            .map-block .name-lbl {
                font-size: clamp(7.5px, 2.3vw, 10.5px);
            }
            .grid-map {
                gap: 6px;
            }
            .map-row {
                gap: 6px;
            }
        }

        /* ===== Dark mode (deep moss) ===== */
        body.dark {
            background:
                radial-gradient(circle at 15% 8%, rgba(201,249,141,.05), transparent 45%),
                radial-gradient(circle at 90% 92%, rgba(123,168,63,.1), transparent 40%),
                #10160a;
            color: #eaf5da;
        }
        body.dark .ios-capsule {
            background: #182010;
            border-color: rgba(201,249,141,0.14);
            box-shadow: 0 18px 40px -18px rgba(0,0,0,.6);
        }
        body.dark .search-box input {
            color: #eaf5da;
        }
        body.dark .search-box .icon {
            color: #9db98a;
        }
        body.dark .zone-title,
        body.dark .card-title {
            color: var(--gold);
        }
        body.dark .card-title .icon,
        body.dark .zone-title .icon {
            color: var(--gold);
        }
        body.dark .card {
            background: #182010;
            border-color: rgba(201,249,141,0.14);
            box-shadow: 0 18px 40px -18px rgba(0,0,0,.6);
        }
        body.dark .clickable-item {
            background: #1f2915;
            border-color: rgba(201,249,141,0.14);
            color: #eaf5da;
        }
        body.dark .clickable-item:hover {
            background: #263219;
            border-color: var(--gold);
        }
        body.dark .clickable-item.active {
            background: var(--gold);
            color: #17210c;
            border-color: var(--gold);
        }
        body.dark .map-block {
            background: #1f2915;
            border-color: rgba(201,249,141,0.14);
            color: #eaf5da;
        }
        body.dark .map-block:hover {
            border-color: var(--gold);
        }
        body.dark .map-block.active {
            background: var(--gold);
            color: #17210c;
            border-color: var(--gold);
        }
        body.dark .map-block.core-center {
            border-color: var(--gold);
            background: #232f16;
        }
        body.dark .zip-info-text .area-name {
            color: #eaf5da;
        }
        body.dark .zip-info-text .zip-number {
            color: var(--gold);
            background: #1f2915;
            border-color: rgba(201,249,141,0.14);
        }
        body.dark .copy-btn {
            background: var(--gold);
            color: #17210c;
            box-shadow: 0 4px 10px rgba(201,249,141,0.25);
        }
        body.dark .copy-btn:hover {
            background: #b6e876;
        }
        body.dark .copy-btn.share-btn {
            background: #1f2915;
            color: #eaf5da;
            border-color: rgba(201,249,141,0.18);
        }
        body.dark .theme-toggle {
            background: #1f2915;
            border-color: rgba(201,249,141,0.18);
            color: var(--gold);
        }
        body.dark .empty-state {
            color: #9db98a;
        }
        body.dark .empty-state .icon {
            color: #3a4a29;
        }
        body.dark .toast {
            background: var(--gold);
            color: #17210c;
        }
        body.dark mark {
            background: var(--crimson);
            color: #10160a;
        }
        body.dark .copy-btn.active-fav-btn {
            background: #c9932f;
            color: #17210c;
            border-color: #c9932f;
        }
        body.dark .app-install-icon {
            background: #1f2915;
        }
        body.dark .app-install-title {
            color: #eaf5da;
        }
        body.dark .app-install-sub {
            color: #9db98a;
        }
        body.dark .app-install-btn {
            background: var(--gold);
            color: #17210c;
        }
        body.dark .app-install-btn:hover {
            background: #b6e876;
        }
        body.dark .app-install-close {
            color: #9db98a;
        }
        body.dark .app-install-close:hover {
            background: #1f2915;
            color: #eaf5da;
        }

        /* ===== Favorites row ===== */
        .fav-row {
            display: none;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .fav-chip {
            flex-shrink: 0;
            background: var(--card-alt);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 400;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--crimson-dark);
        }
        body.dark .fav-chip {
            background: #1f2915;
            border-color: rgba(201,249,141,0.14);
            color: #eaf5da;
        }
    </style>
</head>
<body>

    <!-- App Install Banner: FT Web Hub -->
    <div class="app-install-banner ios-capsule" id="appInstallBanner">
        <img class="app-install-icon" src="https://blogger.googleusercontent.com/img/a/AVvXsEjGgWW40j8O0ARA_3VopGxnqwBIY7GA2V_JMqIKT9T74khSL3jsZI-HaHf_CuchfO_iYiykpyJfm6pLOCDXTzn0zi58LZziayGOvr8SRYqPTpdIUUuAXZyVjVBF3T7ehyJrnDtK-c5pjnFMQ5yAnGjUhcHaqmix7VZEzO7eINfbcn8yEO4Y-1tPw80EMlGT" alt="FT Web Hub">
        <div class="app-install-text">
            <div class="app-install-title">FT Web Hub</div>
            <div class="app-install-sub">ติดตั้งแอปเพื่อใช้งานสะดวกยิ่งขึ้น</div>
        </div>

          ]},
          {district:3, provName:"ประปาแตก", areaCode:"314", entries:[
            {zip:"31461",name:"ประปาแตก"}
          ]}
        ];

        // ===== Theme =====
        function applyTheme(mode) {
            document.body.classList.toggle('dark', mode === 'dark');
            document.getElementById('themeIcon').innerHTML = mode === 'dark' ? ICON_SUN : ICON_MOON;
            document.querySelector('meta[name="theme-color"]').setAttribute('content', mode === 'dark' ? '#10160a' : '#fafff5');
        }
        function currentTheme() {
            return document.body.classList.contains('dark') ? 'dark' : 'light';
        }
        function toggleTheme() {
            const next = currentTheme() === 'dark' ? 'light' : 'dark';
            localStorage.setItem('zipapp_theme', next);
            applyTheme(next);
        }
        function getInitialTheme() {
            const saved = localStorage.getItem('zipapp_theme');
            if (saved === 'dark' || saved === 'light') return saved;
            // ยังไม่เคยเลือกธีมเอง -> ใช้ธีมตามระบบปฏิบัติการ/เบราว์เซอร์
            return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        applyTheme(getInitialTheme());
        // ถ้ายังไม่เคยกดเลือกธีมเอง ให้ตามระบบแบบเรียลไทม์เมื่อผู้ใช้เปลี่ยนธีมเครื่อง
        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                if (localStorage.getItem('zipapp_theme') === null) {
                    applyTheme(e.matches ? 'dark' : 'light');
                }
            });
        }

        // ===== Favorites =====
        function getFavs() {
            try { return JSON.parse(localStorage.getItem('zipapp_favs') || '[]'); }
            catch(e) { return []; }
        }
        function saveFavs(favs) {
            localStorage.setItem('zipapp_favs', JSON.stringify(favs));
        }
        function isFav(zip) {
            return getFavs().some(f => f.zip === zip);
        }
        function toggleFav(entry) {
            let favs = getFavs();
            if (favs.some(f => f.zip === entry.zip)) {
                favs = favs.filter(f => f.zip !== entry.zip);
            } else {
                favs.unshift({zip: entry.zip, name: entry.name});
                favs = favs.slice(0, 12);
            }
            saveFavs(favs);
            renderFavRow();
            const btn = document.getElementById('favToggleBtn');
            if (btn) {
                const nowFav = isFav(entry.zip);
                btn.classList.toggle('active-fav-btn', nowFav);
                btn.innerHTML = `<span class="icon">${nowFav ? ICON_STAR_FILLED : ICON_STAR_OUTLINE}</span>`;
            }
        }
        function renderFavRow() {
            const favs = getFavs();
            const row = document.getElementById('favRow');
            if (favs.length === 0) { row.style.display = 'none'; row.innerHTML = ''; return; }
            row.style.display = 'flex';
            row.innerHTML = favs.map(f => `
                <div class="fav-chip" onclick='showFloatingZipcode(${JSON.stringify(f)})'>
                    <span class="icon" style="width:11px;height:11px;">${ICON_STAR_FILLED}</span> ${f.name}
                </div>
            `).join('');
        }
        renderFavRow();

        // ===== FT Web Hub install banner =====
        function dismissInstallBanner() {
            const banner = document.getElementById('appInstallBanner');
            if (banner) banner.classList.add('hidden');
            localStorage.setItem('ftWebHubBannerDismissed', '1');
        }
        if (localStorage.getItem('ftWebHubBannerDismissed') === '1') {
            const banner = document.getElementById('appInstallBanner');
            if (banner) banner.classList.add('hidden');
        }

        // Stagger fade-in animation for map blocks on load
        document.querySelectorAll('.map-block').forEach((block, idx) => {
            block.style.animationDelay = `${idx * 0.045}s`;
        });

        function selectProvince(areaCode, element) {
            const match = DATA.find(p => p.areaCode === areaCode);
            if(!match) return;

            document.querySelectorAll('.map-block').forEach(b => b.classList.remove('active'));
            if(element) {
                element.style.animationDelay = '0s';
                element.classList.add('active');
            }

            document.getElementById('zoneTitle').innerHTML = `<span class="icon">${ICON_PIN}</span> ${match.provName}`;
            renderDistricts(match.entries);
            document.getElementById('bottomFloatingPanel').style.display = 'none';
        }

        function renderDistricts(entries) {
            const container = document.getElementById('districtContainer');
            const panel = document.getElementById('districtResultsPanel');
            container.innerHTML = '';

            entries.forEach((entry, idx) => {
                const item = document.createElement('div');
                item.className = 'clickable-item';
                item.style.animationDelay = `${idx * 0.035}s`;
                item.innerText = entry.name;
                item.addEventListener('click', () => {
                    document.querySelectorAll('.clickable-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    showFloatingZipcode(entry);
                });
                container.appendChild(item);
            });
            openPanel(panel);
        }

        function openPanel(panel) {
            panel.style.display = 'block';
            panel.classList.remove('panel-open');
            // force reflow so the animation restarts every time
            void panel.offsetWidth;
            panel.classList.add('panel-open');
        }

        function showFloatingZipcode(entry) {
            const panel = document.getElementById('bottomFloatingPanel');
            const canShare = !!navigator.share;
            const fav = isFav(entry.zip);
            panel.innerHTML = `
                <div class="zip-display-row">
                    <div class="zip-info-text">
                        <span class="area-name">${entry.name}</span>
                        <span class="zip-number">${entry.zip}</span>
                    </div>
                    <div class="action-btns">
                        <button class="copy-btn share-btn ${fav ? 'active-fav-btn' : ''}" id="favToggleBtn" onclick='toggleFav(${JSON.stringify(entry)})' aria-label="บันทึกรายการโปรด">
                            <span class="icon">${fav ? ICON_STAR_FILLED : ICON_STAR_OUTLINE}</span>
                        </button>
                        ${canShare ? `<button class="copy-btn share-btn" onclick='shareZip(${JSON.stringify(entry)})' aria-label="แชร์">
                            <span class="icon">${ICON_SHARE}</span>
                        </button>` : ''}
                        <button class="copy-btn" onclick="copyZip('${entry.zip}')" aria-label="คัดลอก">
                            <span class="icon">${ICON_COPY}</span>
                        </button>
                    </div>
                </div>
            `;
            openPanel(panel);
        }

        function copyZip(zip) {
            navigator.clipboard.writeText(zip).then(() => {
                showToast('คัดลอกสำเร็จ');
            });
        }

        function shareZip(entry) {
            navigator.share({
                title: entry.name,
                text: `${entry.name} รหัสไปรษณีย์ ${entry.zip}`
            }).catch(() => {});
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // normalize: lowercase + strip spaces so "ต้ม ยำ ไก่" or extra spacing still matches
        function normalize(str) {
            return str.toLowerCase().replace(/\s+/g, '');
        }

        function highlightMatch(text, query) {
            if (!query) return text;
            const nText = normalize(text);
            const idx = nText.indexOf(query);
            if (idx === -1) return text;
            // map normalized index back to original string (safe here since Thai text rarely has spaces mid-word)
            return text.slice(0, idx) + '<mark>' + text.slice(idx, idx + query.length) + '</mark>' + text.slice(idx + query.length);
        }

        function clearSearch() {
            const input = document.getElementById('globalSearch');
            input.value = '';
            input.dispatchEvent(new Event('input'));
            input.focus();
        }

        document.getElementById('globalSearch').addEventListener('input', function(e) {
            const raw = e.target.value.trim();
            const query = normalize(raw);
            const panel = document.getElementById('districtResultsPanel');
            document.getElementById('clearSearchBtn').style.display = raw ? 'inline-flex' : 'none';

            if (!query) {
                document.querySelectorAll('.map-block').forEach(b => b.classList.remove('active'));
                panel.style.display = 'none';
                document.getElementById('bottomFloatingPanel').style.display = 'none';
                return;
            }

            // rank matches: exact name > name starts with query > name contains query
            // > province matches > zip code contains query
            let results = [];
            DATA.forEach(prov => {
                const provMatch = normalize(prov.provName).includes(query);
                prov.entries.forEach(e => {
                    const nName = normalize(e.name);
                    let score = -1;
                    if (nName === query) score = 0;
                    else if (nName.startsWith(query)) score = 1;
                    else if (nName.includes(query)) score = 2;
                    else if (e.zip.includes(query)) score = 3;
                    else if (provMatch) score = 4;
                    if (score >= 0) results.push({entry: {...e, provName: prov.provName}, score});
                });
            });
            results.sort((a, b) => a.score - b.score);
            const filteredEntries = results.map(r => r.entry);

            if (filteredEntries.length > 0) {
                document.getElementById('zoneTitle').innerHTML = `<span class="icon">${ICON_SEARCH}</span> ผลค้นหา (${filteredEntries.length})`;
                const distContainer = document.getElementById('districtContainer');
                distContainer.innerHTML = '';

                filteredEntries.forEach((entry, idx) => {
                    const item = document.createElement('div');
                    item.className = 'clickable-item';
                    item.style.animationDelay = `${idx * 0.035}s`;
                    item.innerHTML = highlightMatch(entry.name, query) + `<span class="prov-tag">${entry.provName}</span>`;
                    item.addEventListener('click', () => {
                        document.querySelectorAll('.clickable-item').forEach(i => i.classList.remove('active'));
                        item.classList.add('active');
                        showFloatingZipcode(entry);
                    });
                    distContainer.appendChild(item);
                });
                openPanel(panel);

                if(filteredEntries.length === 1) {
                    showFloatingZipcode(filteredEntries[0]);
                }
            } else {
                document.getElementById('districtContainer').innerHTML = `
                    <div class="empty-state">
                        <span class="icon">${ICON_SEARCH_OFF}</span>
                        <p>ไม่พบข้อมูล ลองพิมพ์ชื่อพื้นที่หรือรหัสไปรษณีย์</p>
                    </div>`;
                panel.style.display = 'block';
                document.getElementById('bottomFloatingPanel').style.display = 'none';
            }
        });
    </script>
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('SW Registered!', reg))
        .catch(err => console.error('SW Error:', err));
    });
  }
</script>
</body>
</html>
